{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Criar Chamado</h1>
</div>

<div class="form-card">
    <form action="#" method="POST">
        <div class="form-group">
            <label for="nome">Nome Solicitante</label>
            <input type="text" id="nome" class="form-control" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="sala">Sala / Local</label>
            <input type="text" id="sala" class="form-control" placeholder="Ex: Laboratório 1, Sala 203" required>
        </div>

        <div class="form-group">
            <label for="maquina">Identificação da Máquina (Opcional)</label>
            <input type="text" id="maquina" class="form-control" placeholder="Ex: PC 04">
        </div>

        <div class="form-group">
            <label for="descricao">Descrição do Problema</label>
            <textarea id="descricao" class="form-control" rows="4" placeholder="Descreva o que está acontecendo..." required></textarea>
        </div>

        <button type="button" class="btn btn-primary" onclick="alert('Chamado criado! (Mock)')">Salvar Chamado</button>
    </form>
</div>
{% endblock %}
